---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint "ansible-lint>=24.0.0" "ansible-core>=2.15"

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint -c .yamllint .

      - name: ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule (patch_management role, Rocky Linux 9)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule + Docker driver
        run: |
          python -m pip install --upgrade pip
          pip install "molecule>=24.0.0" "molecule-plugins[docker]" "ansible-core>=2.15"

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run Molecule test
        working-directory: roles/patch_management
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
