---
# Example production inventory. Replace with your real hosts.
# Hosts are split into two batches per OS group so a bad patch on batch1
# is caught before batch2 is touched (see `serial` in playbooks/patch.yml).
all:
  children:
    rhel8_servers:
      children:
        rhel8_batch1:
          hosts:
            web01.example.internal:
            web02.example.internal:
        rhel8_batch2:
          hosts:
            web03.example.internal:
            web04.example.internal:
    rhel9_servers:
      children:
        rhel9_batch1:
          hosts:
            app01.example.internal:
            app02.example.internal:
        rhel9_batch2:
          hosts:
            app03.example.internal:
            app04.example.internal:
    db_servers:
      hosts:
        db01.example.internal:
          # Databases patch alone, no batching, reboot must be manually approved
          patch_reboot_allowed: false
